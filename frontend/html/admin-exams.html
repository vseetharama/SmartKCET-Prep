<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartKCET Prep — Admin Exams</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
  <div class="bg-mesh"></div>

  <!-- Admin Navbar -->
  <nav class="navbar">
    <div class="nav-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <span class="brand-name">SmartKCET<span class="brand-ai">Admin</span></span>
    </div>
    <div class="nav-links">
      <a href="/admin/upload" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload
      </a>
      <a href="/admin/questions" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Questions
      </a>
      <a href="/admin/exams" class="nav-pill active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Exams
      </a>
      <a href="/admin/analytics" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Analytics
      </a>
    </div>
    <div class="nav-actions">
      <a href="#" class="nav-pill" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="main-wrap">

    <!-- Create Exam Section -->
    <div class="section-card">
      <div class="section-card-header">
        <div class="section-icon" style="background:linear-gradient(135deg,rgba(124,58,237,0.2),rgba(37,99,235,0.2));">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </div>
        <div>
          <h2>Create Exam</h2>
          <p class="section-sub">Generate a new exam set (4 sets × 20 questions = 80 questions required)</p>
        </div>
      </div>
      <div class="section-body">
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
          <div class="input-group">
            <label class="input-label" for="examNameInput">Exam Name</label>
            <input type="text" id="examNameInput" class="text-input" placeholder="e.g. Mid-Term 2024" style="min-width:200px;"/>
          </div>
          <div class="input-group">
            <label class="input-label" for="subjectSelect">Subject</label>
            <select id="subjectSelect" class="text-input" style="min-width:200px;">
              <option value="">Select subject…</option>
              <option value="Biology">Biology</option>
              <option value="Physics">Physics</option>
              <option value="Chemistry">Chemistry</option>
              <option value="Mathematics">Mathematics</option>
            </select>
          </div>
          <button id="createExamBtn" class="btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Create Exam
          </button>
        </div>
        <div id="createMessage" style="margin-top:12px;display:none;"></div>
      </div>
    </div>

    <!-- Exams List Section -->
    <div class="section-card">
      <div class="section-card-header">
        <div class="section-icon" style="background:linear-gradient(135deg,rgba(8,145,178,0.2),rgba(5,150,105,0.2));">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        </div>
        <div>
          <h2>All Exams</h2>
          <p class="section-sub" id="examCount">Loading exams…</p>
        </div>
      </div>
      <div class="section-body" style="padding:0;">
        <div class="table-scroll">
          <table class="results-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Created</th>
                <th>Sets</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="examsTableBody">
              <tr><td colspan="6" style="text-align:center;color:var(--muted);padding:32px;">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="../js/auth.js"></script>
  <script>
  (function () {
    'use strict';

    // ── Auth guard: redirect non-admins ──────────────────────────────────
    Auth.currentRole().then(function (user) {
      if (!user || user.role !== 'admin') {
        window.location.href = '/login';
      }
    });

    // ── Logout ───────────────────────────────────────────────────────────
    document.getElementById('logoutBtn').addEventListener('click', function (e) {
      e.preventDefault();
      fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
        .finally(function() { window.location.href = '/login'; });
    });

    // ── State ────────────────────────────────────────────────────────────
    var exams = [];

    // ── Load exams ───────────────────────────────────────────────────────
    function loadExams() {
      fetch('/api/admin/exams', { credentials: 'include' })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          exams = data.exams || [];
          renderExams();
        })
        .catch(function () {
          document.getElementById('examsTableBody').innerHTML =
            '<tr><td colspan="6" style="text-align:center;color:var(--red-l);padding:32px;">Failed to load exams</td></tr>';
        });
    }

    // ── Render exams table ───────────────────────────────────────────────
    function renderExams() {
      var tbody = document.getElementById('examsTableBody');
      var countEl = document.getElementById('examCount');

      if (exams.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:32px;">No exams created yet</td></tr>';
        countEl.textContent = '0 exams';
        return;
      }

      countEl.textContent = exams.length + ' exam' + (exams.length !== 1 ? 's' : '');

      tbody.innerHTML = exams.map(function (exam) {
        var examName = exam.exam_name || 'Untitled';
        var createdDate = exam.created_at ? new Date(exam.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
        var statusClass = exam.is_published ? 'score-high' : '';
        var statusText = exam.is_published ? 'Published' : 'Unpublished';
        var toggleLabel = exam.is_published ? 'Unpublish' : 'Publish';
        var toggleClass = exam.is_published ? 'btn-outline small' : 'btn-primary small';

        return '<tr>' +
          '<td>' + escapeHtml(examName) + '</td>' +
          '<td>' + escapeHtml(exam.subject) + '</td>' +
          '<td>' + createdDate + '</td>' +
          '<td>' + (exam.set_count || 4) + ' sets</td>' +
          '<td><span class="score-badge ' + statusClass + '">' + statusText + '</span></td>' +
          '<td><button class="' + toggleClass + '" data-exam-id="' + exam.exam_id + '" data-publish="' + (!exam.is_published) + '">' + toggleLabel + '</button></td>' +
          '</tr>';
      }).join('');

      // Attach toggle handlers
      tbody.querySelectorAll('button[data-exam-id]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var examId = btn.getAttribute('data-exam-id');
          var publish = btn.getAttribute('data-publish') === 'true';
          togglePublish(examId, publish);
        });
      });
    }

    // ── Create exam ──────────────────────────────────────────────────────
    document.getElementById('createExamBtn').addEventListener('click', function () {
      var subject = document.getElementById('subjectSelect').value;
      var examName = document.getElementById('examNameInput').value.trim();
      var msgEl = document.getElementById('createMessage');

      if (!subject) {
        showMessage(msgEl, 'Please select a subject.', 'warn');
        return;
      }

      var btn = document.getElementById('createExamBtn');
      btn.disabled = true;
      btn.textContent = 'Creating…';

      var body = { subject: subject };
      if (examName) body.exam_name = examName;

      fetch('/api/admin/exams', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(body),
      })
        .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; }); })
        .then(function (result) {
          btn.disabled = false;
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Create Exam';

          if (result.ok) {
            showMessage(msgEl, 'Exam created successfully for ' + subject + '!', 'success');
            loadExams();
          } else if (result.status === 422) {
            var d = result.data;
            showMessage(msgEl, 'Cannot create exam: ' + subject + ' has only ' + (d.count || 0) + ' questions (need ' + (d.required || 80) + ').', 'error');
          } else {
            showMessage(msgEl, (result.data && result.data.message) || 'Failed to create exam.', 'error');
          }
        })
        .catch(function () {
          btn.disabled = false;
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Create Exam';
          showMessage(msgEl, 'Network error. Please try again.', 'error');
        });
    });

    // ── Publish / Unpublish toggle ───────────────────────────────────────
    function togglePublish(examId, publish) {
      fetch('/api/admin/exams/' + examId, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ is_published: publish }),
      })
        .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (result) {
          if (result.ok) {
            loadExams();
          } else {
            alert((result.data && result.data.message) || 'Failed to update publish status.');
          }
        })
        .catch(function () {
          alert('Network error. Please try again.');
        });
    }

    // ── Helpers ──────────────────────────────────────────────────────────
    function showMessage(el, text, type) {
      el.style.display = 'block';
      el.textContent = text;
      el.style.padding = '10px 14px';
      el.style.borderRadius = 'var(--rs)';
      el.style.fontSize = '0.85rem';
      el.style.fontWeight = '600';
      if (type === 'success') {
        el.style.background = 'rgba(5,150,105,0.12)';
        el.style.color = 'var(--green-l)';
        el.style.border = '1px solid rgba(5,150,105,0.3)';
      } else if (type === 'error') {
        el.style.background = 'rgba(220,38,38,0.12)';
        el.style.color = 'var(--red-l)';
        el.style.border = '1px solid rgba(220,38,38,0.3)';
      } else {
        el.style.background = 'rgba(217,119,6,0.12)';
        el.style.color = 'var(--yellow-l)';
        el.style.border = '1px solid rgba(217,119,6,0.3)';
      }
      setTimeout(function () { el.style.display = 'none'; }, 6000);
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str || ''));
      return div.innerHTML;
    }

    // ── Init ─────────────────────────────────────────────────────────────
    loadExams();
  })();
  </script>
</body>
</html>
